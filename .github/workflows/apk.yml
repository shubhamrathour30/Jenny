name: Build Jenny APK
on:
  workflow_dispatch:
  push:
    paths:
      - "apk/**"
      - ".github/workflows/apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: bash apk/build.sh
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jenny-latest --yes --cleanup-tag || true
          gh release create jenny-latest Jenny.apk --title "Jenny Android app" --notes "Latest Jenny APK. Download Jenny.apk and install it on your phone." --target main
